<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Almuerzo — YAMBOLY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    --azul: #502278;
    --azul-claro: #B6CFD0;
    --azul-suave: #DDE5ED;
    --verde-suave: #EBF0E3;
    --blanco: #ffffff;
    --gris: #f4f6f9;
    --texto: #1a2535;
    --error: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--azul-suave);
    min-height: 100vh;
    padding: 16px 16px 60px;
    color: var(--texto);
  }

  .container { max-width: 640px; margin: 0 auto; }

  .cabecera {
    width: 100%;
    max-width: 100%;
    border-radius: 20px 20px 0 0;
    display: block;
    margin-bottom: 0;
  }

  .fecha-bar {
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    padding: 14px 16px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .card {
    background: var(--blanco);
    padding: 28px;
    border-top: 1px solid #e8eef5;
  }
  .card:last-of-type {
    border-radius: 0 0 20px 20px;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--azul);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--azul-suave);
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #502278;
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d1dce8;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--texto);
    background: var(--gris);
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(56,73,103,0.1);
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .dias-grid { display: grid; gap: 8px; }

  .dia-card {
    border: 1.5px solid #d1dce8;
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .dia-card.bloqueado {
    opacity: 0.6;
    pointer-events: none;
  }

  .dia-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    background: var(--gris);
    user-select: none;
  }
  .dia-card.activo .dia-header {
    background: var(--azul);
    color: white;
  }

  .dia-check {
    width: 22px; height: 22px;
    border: 2px solid #aab8cc;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 0.8rem;
  }
  .dia-card.activo .dia-check {
    background: white;
    color: var(--azul);
  }

  .dia-nombre { font-size: 0.9rem; font-weight: 600; flex: 1; }
  .dia-fecha-label { font-size: 0.75rem; opacity: 0.7; }

  .dia-opciones {
    display: none;
    padding: 16px;
    background: white;
    gap: 14px;
    flex-direction: column;
  }
  .dia-card.activo .dia-opciones { display: flex; }

  .opcion-group label.group-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #718096;
    margin-bottom: 8px;
    display: block;
  }

  .radio-grid { display: grid; gap: 6px; }

  .radio-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.88rem;
  }
  .radio-opt:hover { border-color: var(--azul-claro); }
  .radio-opt input[type="radio"] { display: none; }

  .radio-dot {
    width: 18px; height: 18px;
    border: 2px solid #cbd5e0;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .radio-opt.selected {
    border-color: var(--azul);
    background: #f0f4f9;
  }
  .radio-opt.selected .radio-dot {
    background: var(--azul);
    border-color: var(--azul);
    color: white;
    font-size: 0.65rem;
  }

  .msg {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
    text-align: center;
    font-size: 0.9rem;
  }
  .msg.error {
    display: block;
    background: #fadbd8;
    color: #922b21;
    border: 1px solid #f5b7b1;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover { background: #2d3a52; }
  .btn-submit:disabled { background: #cbd5e0; cursor: not-allowed; }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top: 2px solid white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .resumen {
    display: none;
    background: linear-gradient(135deg, rgba(80,34,120,0.95), rgba(80,34,120,0.85));
    color: white;
    padding: 24px;
    border-radius: 20px;
    margin-top: 20px;
  }

  .resumen-titulo {
    font-size: 1.6rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
  }

  .resumen-subtitulo {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 12px;
    opacity: 0.9;
  }

  .resumen-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.9rem;
  }
  .resumen-item span { opacity: 0.8; }
  .resumen-item strong { font-weight: 600; }

  .resumen-detalle {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.2);
  }

  .resumen-final {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 700;
    margin-top: 16px;
  }

  .ayuda-text {
    text-align: center;
    font-size: 0.8rem;
    color: #718096;
    margin-top: 20px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="container">
  <img src="https://raw.githubusercontent.com/clapps26/pedidos-yamboly/main/Cabecera.png" alt="Cabecera" class="cabecera">
  
  <div class="fecha-bar">
    <span id="fechaHoy">Cargando...</span>
  </div>

  <form id="formulario" class="card">
    <div id="msgError" class="msg"></div>

    <div class="section-title">📋 Tus Datos</div>

    <div class="field">
      <label>DNI *</label>
      <input type="text" id="dni" placeholder="12345678" maxlength="8" required>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Nombres *</label>
        <input type="text" id="nombres" placeholder="Juan" required>
      </div>
      <div class="field">
        <label>Apellidos *</label>
        <input type="text" id="apellidos" placeholder="Pérez" required>
      </div>
    </div>

    <div class="field">
      <label>Cargo *</label>
      <input type="text" id="cargo" placeholder="Operario" required>
    </div>

    <div class="field">
      <label>Área/Departamento *</label>
      <input type="text" id="area" placeholder="Ej: Producción" required>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Teléfono (opcional)</label>
        <input type="tel" id="telefono" placeholder="987654321">
      </div>
      <div class="field">
        <label>Email (opcional)</label>
        <input type="email" id="correo" placeholder="tu@email.com">
      </div>
    </div>
  </form>

  <div class="card">
    <div class="section-title">📅 Selecciona tus días</div>
    <div id="diasGrid" class="dias-grid"></div>
    <div id="loadingMenu" style="text-align:center; padding:20px; color:#718096;">Cargando días disponibles...</div>
    <div id="sinDias" style="display:none; text-align:center; padding:20px; color:#a0aec0;">No hay días disponibles.</div>
  </div>

  <div class="card">
    <button type="submit" class="btn-submit" id="btnSubmit" form="formulario">
      <span id="btnTexto">Registrar mi pedido</span>
      <div id="spinner" class="spinner"></div>
    </button>

    <div class="ayuda-text">
      ¿Dudas o cancelaciones?<br>
      Contacta al área de <strong>Bienestar Social</strong>
    </div>
  </div>

  <div id="resumenPedido" class="resumen"></div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwvDqw6EIE3zoHr7XROXOmPsPKBBeYv78MjGZVCTaFhnv8Be1WIoHOKiBEOR4IPlDs4w/exec';
  
  let diasDisponibles = [];
  let menuData = null;

  // ============================================================
  // CARGAR MENÚ DESDE APPS SCRIPT
  // ============================================================
  async function cargarMenuDesdeSheets() {
    try {
      const resp = await fetch(`${SCRIPT_URL}?action=getMenu`);
      const data = await resp.json();
      if (data.semana1 && data.semana2) {
        menuData = data;
        console.log('✅ Menú cargado:', JSON.stringify(menuData));
        generarDias();
      } else {
        console.log('⚠️ Estructura de menú incorrecta');
        generarDias();
      }
    } catch (err) {
      console.log('⚠️ Error cargando menú:', err);
      menuData = null;
      generarDias();
    }
  }

  function formatearFecha(date) {
    const opciones = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    return date.toLocaleDateString('es-PE', opciones)
      .replace(/^\w/, c => c.toUpperCase());
  }

  function obtenerDiasDisponibles() {
    const ahora = new Date();
    const horaActual = ahora.getHours();
    
    // Actualizar barra de fecha
    document.getElementById('fechaHoy').textContent = `📅 ${formatearFecha(ahora)}`;

    const diasDisponibles = [];
    const fecha = new Date(ahora);
    fecha.setHours(0, 0, 0, 0);

    // Generar próximos 30 días
    for (let i = 0; i < 30; i++) {
      const fechaISO = fecha.toISOString().split('T')[0];
      const nombreDia = fecha.toLocaleDateString('es-PE', { weekday: 'long' })
        .replace(/^\w/, c => c.toUpperCase());
      const fechaTexto = fecha.toLocaleDateString('es-PE', { day: 'numeric', month: 'short' })
        .replace(/^\w/, c => c.toUpperCase());

      const diaSemana = fecha.getDay();
      const esDomingo = diaSemana === 0;
      const esHoy = i === 0;
      
      // REGLA: No mostrar domingos
      if (esDomingo) {
        fecha.setDate(fecha.getDate() + 1);
        continue;
      }

      // REGLA: Hoy después de las 8 AM → BLOQUEADO
      let bloqueado = false;
      let textoBloqueado = '';
      
      if (esHoy && horaActual >= 8) {
        bloqueado = true;
        textoBloqueado = 'Plazo cerrado';
      }

      // REGLA: Si es HOY y no es bloqueado, mostrar
      // REGLA: Si es mañana o después, mostrar solo si es FUTURO (no pasado)
      if (i > 0 || !bloqueado) {
        diasDisponibles.push({
          id: fechaISO,
          nombre: nombreDia,
          fecha: fechaTexto,
          fechaISO: fechaISO,
          bloqueado: bloqueado,
          textoBloqueado: textoBloqueado
        });
      }

      fecha.setDate(fecha.getDate() + 1);
    }

    return diasDisponibles;
  }

  function getOpcionesMenu(nombreDia, fechaISO) {
    const fallback = {
      sopa: 'Sopa del día',
      entrada: 'Entrada',
      fondo_1: 'Fondo 1',
      fondo_2: 'Fondo 2',
      opcion_light: 'Opción Light'
    };

    if (!menuData) {
      console.log('⚠️ menuData es null');
      return fallback;
    }

    // Determinar cuál semana usar basado en la fecha
    const fecha = new Date(fechaISO + 'T12:00:00');
    const fecha1 = new Date(menuData.semana1.inicio);
    const fecha2 = new Date(menuData.semana2.inicio);

    let menuSemana = null;
    if (fecha >= fecha1 && fecha < fecha2) {
      menuSemana = menuData.semana1.menu;
    } else if (fecha >= fecha2) {
      menuSemana = menuData.semana2.menu;
    }

    if (!menuSemana || !menuSemana[nombreDia]) {
      console.log(`⚠️ No hay menú para ${nombreDia}`);
      return fallback;
    }

    const menuDia = menuSemana[nombreDia];
    return {
      sopa: menuDia['Sopa'] || fallback.sopa,
      entrada: menuDia['Entrada'] || fallback.entrada,
      fondo_1: menuDia['Fondo 1'] || fallback.fondo_1,
      fondo_2: menuDia['Fondo 2'] || fallback.fondo_2,
      opcion_light: menuDia['Opción Light'] || fallback.opcion_light
    };
  }

  function generarDias() {
    diasDisponibles = obtenerDiasDisponibles();
    
    const grid = document.getElementById('diasGrid');
    grid.innerHTML = '';
    document.getElementById('loadingMenu').style.display = 'none';

    if (diasDisponibles.length === 0) {
      document.getElementById('sinDias').style.display = 'block';
      return;
    }

    diasDisponibles.forEach((dia) => {
      const card = document.createElement('div');
      card.className = `dia-card${dia.bloqueado ? ' bloqueado' : ''}`;
      card.id = `card_${dia.id}`;

      if (dia.bloqueado) {
        card.innerHTML = `
          <div class="dia-header" style="cursor:not-allowed;">
            <div class="dia-check">—</div>
            <div style="flex:1;">
              <div class="dia-nombre" style="text-decoration:line-through; opacity:0.6;">${dia.nombre}</div>
              <div class="dia-fecha-label" style="text-decoration:line-through;">${dia.fecha}</div>
            </div>
            <div style="font-size:0.75rem; opacity:0.6;">${dia.textoBloqueado}</div>
          </div>`;
      } else {
        const m = getOpcionesMenu(dia.nombre, dia.fechaISO);
        card.innerHTML = `
          <div class="dia-header" onclick="toggleDia('${dia.id}')">
            <div class="dia-check" id="check_${dia.id}">☐</div>
            <div style="flex:1;">
              <div class="dia-nombre">${dia.nombre}</div>
              <div class="dia-fecha-label">${dia.fecha}</div>
            </div>
            <div style="font-size:1.2rem;">🍽️</div>
          </div>
          <div class="dia-opciones" id="opciones_${dia.id}">
            <div class="opcion-group">
              <label class="group-label">Entrada</label>
              <div class="radio-grid">
                <label class="radio-opt" onclick="selectRadio(this, 'entrada_${dia.id}')">
                  <input type="radio" name="entrada_${dia.id}" value="${m.sopa}">
                  <div class="radio-dot"></div>
                  🍜 ${m.sopa}
                </label>
                <label class="radio-opt" onclick="selectRadio(this, 'entrada_${dia.id}')">
                  <input type="radio" name="entrada_${dia.id}" value="${m.entrada}">
                  <div class="radio-dot"></div>
                  🥗 ${m.entrada}
                </label>
              </div>
            </div>
            <div class="opcion-group">
              <label class="group-label">Plato de Fondo</label>
              <div class="radio-grid">
                <label class="radio-opt" onclick="selectRadio(this, 'fondo_${dia.id}')">
                  <input type="radio" name="fondo_${dia.id}" value="${m.fondo_1}">
                  <div class="radio-dot"></div>
                  🍽️ ${m.fondo_1}
                </label>
                <label class="radio-opt" onclick="selectRadio(this, 'fondo_${dia.id}')">
                  <input type="radio" name="fondo_${dia.id}" value="${m.fondo_2}">
                  <div class="radio-dot"></div>
                  🍽️ ${m.fondo_2}
                </label>
                <label class="radio-opt" onclick="selectRadio(this, 'fondo_${dia.id}')">
                  <input type="radio" name="fondo_${dia.id}" value="${m.opcion_light}">
                  <div class="radio-dot"></div>
                  🥦 ${m.opcion_light}
                </label>
              </div>
            </div>
          </div>`;
      }

      grid.appendChild(card);
    });
  }

  function toggleDia(diaId) {
    const card = document.getElementById(`card_${diaId}`);
    const check = document.getElementById(`check_${diaId}`);
    const activo = card.classList.contains('activo');
    
    if (activo) {
      card.classList.remove('activo');
      check.textContent = '☐';
      const radios = card.querySelectorAll('.radio-opt');
      radios.forEach(r => r.classList.remove('selected'));
      const inputs = card.querySelectorAll('input[type="radio"]');
      inputs.forEach(i => i.checked = false);
    } else {
      card.classList.add('activo');
      check.textContent = '✓';
    }
  }

  function selectRadio(label, groupName) {
    const group = label.closest('.radio-grid');
    group.querySelectorAll('.radio-opt').forEach(l => l.classList.remove('selected'));
    label.classList.add('selected');
    label.querySelector('input').checked = true;
  }

  document.getElementById('formulario').addEventListener('submit', async function(e) {
    e.preventDefault();
    ocultarMensaje();

    const dni = document.getElementById('dni').value.trim();
    const nombres = document.getElementById('nombres').value.trim();
    const apellidos = document.getElementById('apellidos').value.trim();
    const cargo = document.getElementById('cargo').value.trim();
    const area = document.getElementById('area').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const correo = document.getElementById('correo').value.trim();

    if (!dni || !/^\d{8}$/.test(dni)) return mostrarError('El DNI debe tener exactamente 8 dígitos.');
    if (!nombres) return mostrarError('Por favor ingresa tu nombre(s).');
    if (!apellidos) return mostrarError('Por favor ingresa tu apellido(s).');
    if (!cargo) return mostrarError('Por favor ingresa tu cargo.');
    if (!area) return mostrarError('Por favor ingresa tu área/departamento.');

    const pedidos = [];
    const diasActivos = document.querySelectorAll('.dia-card.activo');
    
    if (diasActivos.length === 0) return mostrarError('Selecciona al menos un día para pedir tu almuerzo.');

    let hayError = false;
    diasActivos.forEach(card => {
      const cardId = card.id.replace('card_', '');
      const diaInfo = diasDisponibles.find(d => d.id === cardId);
      
      const entradaInput = card.querySelector(`input[name="entrada_${cardId}"]:checked`);
      const fondoInput = card.querySelector(`input[name="fondo_${cardId}"]:checked`);

      if (!entradaInput || !fondoInput) {
        hayError = true;
        return;
      }

      pedidos.push({
        fecha: diaInfo.fechaISO,
        fechaTexto: `${diaInfo.nombre} ${diaInfo.fecha}`,
        entrada: entradaInput.value,
        fondo: fondoInput.value
      });
    });

    if (hayError) return mostrarError('Completa entrada y plato de fondo para todos los días seleccionados.');

    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('btnTexto').textContent = 'Enviando...';
    document.getElementById('spinner').style.display = 'block';

    const datos = {
      dni, nombres, apellidos, cargo, area, telefono, correo,
      pedidos: pedidos,
      totalAlmuerzos: pedidos.length,
      fechaRegistro: new Date().toLocaleString('es-PE', { timeZone: 'America/Lima' })
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      });

      mostrarResumen(datos);
      document.getElementById('formulario').style.display = 'none';

    } catch (error) {
      mostrarError('Ocurrió un error. Intenta nuevamente.');
      document.getElementById('btnSubmit').disabled = false;
      document.getElementById('btnTexto').textContent = 'Registrar mi pedido';
      document.getElementById('spinner').style.display = 'none';
    }
  });

  function mostrarResumen(datos) {
    const div = document.getElementById('resumenPedido');
    
    let html = `<div class="resumen-titulo">¡Pedido Realizado!</div>`;
    
    html += `<div class="resumen-subtitulo">Detalle de tu pedido:</div>`;
    html += `<div class="resumen-item"><span>Nombre</span><strong>${datos.nombres} ${datos.apellidos}</strong></div>`;
    html += `<div class="resumen-item"><span>DNI</span><strong>${datos.dni}</strong></div>`;
    html += `<div class="resumen-item"><span>Cargo</span><strong>${datos.cargo}</strong></div>`;
    html += `<div class="resumen-item"><span>Área</span><strong>${datos.area}</strong></div>`;
    html += `<div class="resumen-item"><span>Total de almuerzos</span><strong>${datos.totalAlmuerzos}</strong></div>`;
    
    html += `<div class="resumen-detalle">`;
    datos.pedidos.forEach(p => {
      html += `<div style="margin-bottom: 12px; padding: 8px; background: rgba(255,255,255,0.3); border-radius: 6px;">
        <div style="font-weight: 700; color: white; margin-bottom: 4px;">${p.fechaTexto}</div>
        <div style="color: rgba(255,255,255,0.9); font-size: 0.85rem;">${p.entrada} · ${p.fondo}</div>
      </div>`;
    });
    html += `</div>`;
    
    html += `<div class="resumen-final">🍽️ ¡Disfruta tu almuerzo!</div>`;
    
    div.innerHTML = html;
    div.style.display = 'block';
  }

  function mostrarError(msg) {
    const el = document.getElementById('msgError');
    el.textContent = '⚠️ ' + msg;
    el.className = 'msg error';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function ocultarMensaje() {
    const el = document.getElementById('msgError');
    el.className = 'msg';
  }

  document.getElementById('dni').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 8);
  });

  // INICIALIZAR
  document.addEventListener('DOMContentLoaded', cargarMenuDesdeSheets);
</script>
</body>
</html>
